name: CI Checks

on:
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Demo step
        run: |
          echo "Queue check running on: ${{ github.ref }}"
          sleep 300
